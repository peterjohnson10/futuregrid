<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Detection Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        .slide-in { animation: slideIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 28px; width: 28px;
            border-radius: 50%;
            background: #ffffff;
            border: 4px solid #f59e0b;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            cursor: pointer;
            margin-top: -10px;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.1); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 8px; cursor: pointer;
            background: #e2e8f0; border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans selection:bg-blue-200">

    <div class="fixed inset-0 z-[-1] opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#000 1px, transparent 1px); background-size: 24px 24px;"></div>

    <div class="min-h-screen p-4 md:p-8 flex items-center justify-center">
        <div id="app" class="w-full max-w-5xl"></div>
    </div>

    <script>
        const FALLBACK_IMG = "https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=800&q=80";
        
        // --- GAME DATA ---
        const DOMAINS = ['Tech', 'Policy', 'Social', 'Economic', 'Environmental', 'Geopolitical', 'Military'];
        const STAGES = ['Nascent', 'Emerging', 'Consolidating', 'Established'];
        const IMPACTS = ['Low', 'Medium', 'High'];

        // Simulated data for the MVP to show how Oracle vs Crowd will look
        const SIGNALS = [
            {
                id: 1, 
                image: "https://images.unsplash.com/photo-1621416894569-0f39ed31d247?auto=format&fit=crop&w=800&q=80",
                text: "Philippines central bank approves stablecoin settlement for cross-border payments",
                expert: { 
                    domains: ["Economic", "Policy"], stage: "Emerging", impact: "High", 
                    assumptions: "Evaluated on a 3-5 year horizon prioritizing institutional capital flows over retail crypto adoption.",
                    reasoning: "Regulatory arbitrage signal. Indicates state-level acceptance of parallel financial rails, which forces other central banks to react.", 
                    ambiguity: "Is this localized regulatory innovation or a response to broader financial instability?" 
                },
                crowd: {
                    domains: [{name: "Economic", pct: 75}, {name: "Tech", pct: 45}, {name: "Geopolitical", pct: 20}],
                    stage: [{name: "Emerging", pct: 60}, {name: "Nascent", pct: 25}, {name: "Consolidating", pct: 15}],
                    impact: [{name: "Medium", pct: 50}, {name: "High", pct: 40}, {name: "Low", pct: 10}]
                }
            },
            {
                id: 2, 
                image: "https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=800&q=80",
                text: "Corporate AI spending plateaus while open-source model adoption accelerates 3x",
                expert: { 
                    domains: ["Tech", "Economic"], stage: "Emerging", impact: "Medium", 
                    assumptions: "Evaluated on an immediate 1-2 year enterprise tech horizon. Note: If viewed through a 5-10 year Geopolitical lens (US IP vs Chinese Open Source strategy), Futures Impact shifts to HIGH.",
                    reasoning: "Power redistribution signal. Suggests the value layer is moving away from foundation models toward local, free commoditization.", 
                    ambiguity: "Temporary market correction in enterprise budgets, or a structural collapse of the closed-model moat?" 
                },
                crowd: {
                    domains: [{name: "Tech", pct: 85}, {name: "Geopolitical", pct: 40}, {name: "Economic", pct: 30}],
                    stage: [{name: "Consolidating", pct: 50}, {name: "Emerging", pct: 45}],
                    impact: [{name: "High", pct: 65}, {name: "Medium", pct: 30}]
                }
            },
            {
                id: 3, 
                image: "https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?auto=format&fit=crop&w=800&q=80",
                text: "Gen-Z political engagement drops 40% in Western democracies, rises 60% in TikTok activism",
                expert: { 
                    domains: ["Social", "Geopolitical"], stage: "Consolidating", impact: "High", 
                    assumptions: "Evaluated on systemic stability. Assumes digital engagement translates to real-world volatility.",
                    reasoning: "Institutional legitimacy signal. The medium of civic participation is shifting away from structures the state can control.", 
                    ambiguity: "Democratic erosion, or just a new measurement model for political capital?" 
                },
                crowd: {
                    domains: [{name: "Social", pct: 90}, {name: "Policy", pct: 50}, {name: "Geopolitical", pct: 35}],
                    stage: [{name: "Consolidating", pct: 70}, {name: "Established", pct: 20}],
                    impact: [{name: "High", pct: 80}, {name: "Medium", pct: 20}]
                }
            }
        ];

        // --- APP STATE ---
        let state = {
            view: 'welcome', 
            currentIndex: 0,
            history: [],
            totalPoints: 0,
            selections: { domains: [], stage: '', impact: '', confidence: 50 }
        };

        // --- HELPER LOGIC ---
        function calculateScores() {
            const expert = SIGNALS[state.currentIndex].expert;
            const user = state.selections;
            let alignment = 0;
            
            // Domain Match (up to 40)
            user.domains.forEach(d => {
                if(expert.domains.includes(d)) alignment += 20;
            });
            
            // Stage Match (up to 30)
            const stageDiff = Math.abs(STAGES.indexOf(user.stage) - STAGES.indexOf(expert.stage));
            if (stageDiff === 0) alignment += 30; else if (stageDiff === 1) alignment += 15;

            // Impact Match (up to 30)
            const impactDiff = Math.abs(IMPACTS.indexOf(user.impact) - IMPACTS.indexOf(expert.impact));
            if (impactDiff === 0) alignment += 30; else if (impactDiff === 1) alignment += 15;

            // Double Jeopardy Betting Logic
            const wager = user.confidence;
            let pointsEarned = 0;
            
            // If you are aligned with the Oracle >= 60%, you win your wager. If not, you lose it.
            if (alignment >= 60) {
                pointsEarned = wager;
            } else {
                pointsEarned = -wager;
            }

            return { alignment, pointsEarned, wager };
        }

        // --- STATE MODIFIERS ---
        function setView(view) {
            state.view = view;
            try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch(e) {}
            render();
        }

        function startGame() {
            state.currentIndex = 0;
            state.history = [];
            state.totalPoints = 0;
            state.selections = { domains: [], stage: '', impact: '', confidence: 50 };
            setView('playing');
        }

        function toggleDomain(d) {
            const idx = state.selections.domains.indexOf(d);
            if (idx > -1) {
                state.selections.domains.splice(idx, 1); // Remove if exists
            } else {
                if (state.selections.domains.length < 2) {
                    state.selections.domains.push(d); // Add if less than 2
                } else {
                    state.selections.domains[1] = d; // Replace secondary
                }
            }
            render();
        }

        function selectOption(category, value) {
            state.selections[category] = value;
            render(); 
        }

        function updateConfidence(val) {
            state.selections.confidence = parseInt(val);
            document.getElementById('confidence-val').innerText = val + ' Pts';
        }

        function submitEvaluation() {
            const scores = calculateScores();
            state.totalPoints += scores.pointsEarned;
            
            state.history.push({
                signalId: SIGNALS[state.currentIndex].id,
                userSelections: { ...state.selections, domains: [...state.selections.domains] },
                alignment: scores.alignment,
                pointsEarned: scores.pointsEarned,
                wager: scores.wager
            });
            setView('feedback');
        }

        function nextSignal() {
            if (state.currentIndex < SIGNALS.length - 1) {
                state.currentIndex++;
                state.selections = { domains: [], stage: '', impact: '', confidence: 50 };
                setView('playing');
            } else {
                setView('results');
            }
        }

        window.startGame = startGame;
        window.toggleDomain = toggleDomain;
        window.selectOption = selectOption;
        window.updateConfidence = updateConfidence;
        window.submitEvaluation = submitEvaluation;
        window.nextSignal = nextSignal;

        // --- RENDERERS ---
        const appDiv = document.getElementById('app');

        function render() {
            if (state.view === 'welcome') renderWelcome();
            else if (state.view === 'playing') renderPlaying();
            else if (state.view === 'feedback') renderFeedback();
            else if (state.view === 'results') renderResults();
        }

        function renderWelcome() {
            appDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-[600px] text-center space-y-8 fade-in bg-white p-10 rounded-3xl shadow-xl border border-slate-100 relative overflow-hidden max-w-3xl mx-auto">
                    <div class="absolute top-0 left-0 w-full h-48 bg-gradient-to-br from-indigo-400 via-blue-400 to-amber-400 opacity-20 blur-3xl rounded-full translate-y-[-50%]"></div>
                    <div class="bg-slate-900 p-5 rounded-2xl shadow-lg shadow-slate-900/30 text-white z-10">
                        <i class="ph ph-intersect text-6xl text-amber-400"></i>
                    </div>
                    <div class="z-10 space-y-4">
                        <h1 class="text-4xl md:text-5xl font-black text-slate-900 tracking-tight">Signal Detection</h1>
                        <p class="text-lg text-slate-600 max-w-lg mx-auto leading-relaxed">
                            Develop strategic foresight. Classify weak signals, evaluate Futures Impact, and test your judgment against the AI Oracle and the Community Consensus.
                        </p>
                    </div>
                    <div class="pt-4 z-10 w-full max-w-xs">
                        <button onclick="window.startGame()" class="w-full flex items-center justify-center px-8 py-4 bg-slate-900 hover:bg-amber-500 text-white font-bold rounded-xl transition-all duration-300 shadow-xl shadow-slate-900/20 active:scale-95 text-lg">
                            Start Briefing <i class="ph ph-arrow-right ml-2 text-xl"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderPlaying() {
            const signal = SIGNALS[state.currentIndex];
            const isComplete = state.selections.domains.length > 0 && state.selections.stage && state.selections.impact;
            
            let dots = '';
            for(let i=0; i<SIGNALS.length; i++) {
                let colorClass = i === state.currentIndex ? 'bg-amber-500 w-6' : i < state.currentIndex ? 'bg-indigo-200 w-2' : 'bg-slate-200 w-2';
                dots += `<div class="h-2 rounded-full transition-all duration-300 ${colorClass}"></div>`;
            }

            appDiv.innerHTML = `
                <div class="w-full space-y-6 slide-in max-w-3xl mx-auto">
                    
                    <!-- Header -->
                    <div class="flex justify-between items-center text-sm font-bold text-slate-400 uppercase tracking-wider px-2">
                        <span>Briefing ${state.currentIndex + 1} / ${SIGNALS.length}</span>
                        <div class="flex space-x-1.5">${dots}</div>
                    </div>

                    <!-- Signal Card with Image -->
                    <div class="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden">
                        <div class="h-48 w-full bg-slate-100 relative">
                            <img src="${signal.image}" onerror="this.src='${FALLBACK_IMG}'" class="w-full h-full object-cover" alt="Signal Context" />
                            <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                            <div class="absolute bottom-4 left-6 flex items-center space-x-2">
                                <i class="ph-fill ph-broadcast text-amber-400 text-xl"></i>
                                <span class="text-white font-bold tracking-wider text-sm shadow-sm">INCOMING SIGNAL</span>
                            </div>
                        </div>
                        <div class="p-6 md:p-8">
                            <h2 class="text-2xl md:text-3xl font-semibold text-slate-800 leading-snug">"${signal.text}"</h2>
                        </div>
                    </div>

                    <!-- Interactive Controls -->
                    <div class="bg-white p-6 md:p-8 rounded-3xl border border-slate-200 shadow-xl space-y-8">
                        
                        <!-- Domains (Multi-select) -->
                        <div class="space-y-3">
                            <div class="flex justify-between items-end">
                                <label class="flex items-center text-sm font-bold text-slate-500 uppercase tracking-wider">
                                    <i class="ph ph-intersect mr-2 text-lg"></i> Intersecting Domains
                                </label>
                                <span class="text-xs font-bold text-amber-500 bg-amber-50 px-2 py-1 rounded">Select 1 or 2</span>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                ${DOMAINS.map(d => {
                                    const idx = state.selections.domains.indexOf(d);
                                    let btnClass = 'bg-white border-slate-200 text-slate-600 hover:border-slate-300';
                                    let badge = '';
                                    if (idx === 0) {
                                        btnClass = 'bg-slate-900 border-slate-900 text-white shadow-md';
                                        badge = `<span class="ml-2 text-[10px] bg-white/20 px-1.5 py-0.5 rounded text-white">1ST</span>`;
                                    } else if (idx === 1) {
                                        btnClass = 'bg-slate-700 border-slate-700 text-white shadow-md';
                                        badge = `<span class="ml-2 text-[10px] bg-white/20 px-1.5 py-0.5 rounded text-white">2ND</span>`;
                                    }
                                    return `
                                        <button onclick="window.toggleDomain('${d}')" class="px-4 py-2.5 rounded-xl border-2 text-sm font-bold transition-all flex items-center ${btnClass}">
                                            ${d} ${badge}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <!-- Stage -->
                        <div class="space-y-3">
                            <label class="flex items-center text-sm font-bold text-slate-500 uppercase tracking-wider">
                                <i class="ph ph-chart-line-up mr-2 text-lg"></i> Signal Stage
                            </label>
                            <div class="flex flex-wrap gap-2">
                                ${STAGES.map(s => `
                                    <button onclick="window.selectOption('stage', '${s}')" 
                                        class="px-5 py-2.5 rounded-xl border-2 text-sm font-bold transition-all ${state.selections.stage === s ? 'bg-indigo-50 border-indigo-500 text-indigo-700 shadow-sm' : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300'}">
                                        ${s}
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Impact -->
                        <div class="space-y-3">
                            <label class="flex items-center text-sm font-bold text-slate-500 uppercase tracking-wider">
                                <i class="ph ph-meteor mr-2 text-lg"></i> Futures Impact
                            </label>
                            <div class="flex flex-wrap gap-2">
                                ${IMPACTS.map(i => `
                                    <button onclick="window.selectOption('impact', '${i}')" 
                                        class="px-5 py-2.5 rounded-xl border-2 text-sm font-bold transition-all ${state.selections.impact === i ? 'bg-emerald-50 border-emerald-500 text-emerald-700 shadow-sm' : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300'}">
                                        ${i}
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Double Jeopardy Betting -->
                        <div class="space-y-5 pt-6 border-t border-slate-100 bg-amber-50/50 -mx-6 md:-mx-8 -mb-6 md:-mb-8 p-6 md:p-8 rounded-b-3xl">
                            <div class="flex justify-between items-end">
                                <div>
                                    <label class="flex items-center text-sm font-bold text-slate-700 uppercase tracking-wider">
                                        <i class="ph ph-coins mr-2 text-lg text-amber-500"></i> Confidence Wager
                                    </label>
                                    <p class="text-xs text-slate-500 mt-1 max-w-[200px]">Bet points on your judgment. High alignment wins the bet. Low alignment loses it.</p>
                                </div>
                                <span id="confidence-val" class="text-3xl font-black text-amber-600">${state.selections.confidence} Pts</span>
                            </div>
                            <div class="pt-2 pb-1 relative">
                                <input type="range" min="20" max="100" step="10" value="${state.selections.confidence}" 
                                    oninput="window.updateConfidence(this.value)"
                                    class="w-full h-2 rounded-lg appearance-none outline-none">
                            </div>
                            <div class="flex justify-between text-xs font-bold text-slate-400 uppercase tracking-wider">
                                <span>Low Risk (20)</span>
                                <span>Max Conviction (100)</span>
                            </div>
                        </div>
                    </div>

                    <button onclick="window.submitEvaluation()" ${isComplete ? '' : 'disabled'} 
                        class="w-full py-5 rounded-2xl font-bold text-xl transition-all shadow-xl ${isComplete ? 'bg-slate-900 text-white hover:bg-amber-500 hover:shadow-amber-500/30 active:scale-95' : 'bg-slate-100 text-slate-400 cursor-not-allowed shadow-none'}">
                        Analyze Interpretation
                    </button>
                </div>
            `;
        }

        function renderFeedback() {
            const signal = SIGNALS[state.currentIndex];
            const history = state.history[state.history.length - 1];
            const isLast = state.currentIndex === SIGNALS.length - 1;

            // Helper to render crowd bars
            const renderCrowdBars = (dataArray) => {
                return dataArray.map(item => `
                    <div class="mb-1.5 last:mb-0">
                        <div class="flex justify-between text-[10px] font-bold text-slate-500 uppercase mb-0.5">
                            <span>${item.name}</span><span>${item.pct}%</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-1.5">
                            <div class="bg-blue-300 h-1.5 rounded-full" style="width: ${item.pct}%"></div>
                        </div>
                    </div>
                `).join('');
            };

            appDiv.innerHTML = `
                <div class="w-full space-y-6 slide-in">
                    
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        <!-- LEFT PANEL: The Board (You vs Oracle vs Crowd) -->
                        <div class="lg:col-span-2 bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden flex flex-col">
                            <div class="bg-slate-50 p-4 border-b border-slate-200 flex justify-between items-center">
                                <h3 class="font-black text-slate-800 uppercase tracking-widest text-sm flex items-center">
                                    <i class="ph ph-table mr-2 text-lg text-blue-500"></i> The Analysis Board
                                </h3>
                            </div>
                            
                            <div class="flex-1 p-0">
                                <!-- Table Header -->
                                <div class="grid grid-cols-12 gap-4 bg-slate-100 p-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest border-b border-slate-200">
                                    <div class="col-span-3">Attribute</div>
                                    <div class="col-span-3">Your Call</div>
                                    <div class="col-span-3">Signal Oracle</div>
                                    <div class="col-span-3">Crowd Consensus</div>
                                </div>

                                <!-- DOMAIN ROW -->
                                <div class="grid grid-cols-12 gap-4 p-4 border-b border-slate-100 items-center">
                                    <div class="col-span-3 text-slate-500 font-bold text-xs uppercase tracking-wider">Domains</div>
                                    <div class="col-span-3 flex flex-col gap-1">
                                        ${history.userSelections.domains.map(d => `<span class="px-2 py-1 bg-slate-100 text-slate-700 rounded text-xs font-semibold w-fit">${d}</span>`).join('')}
                                    </div>
                                    <div class="col-span-3 flex flex-col gap-1">
                                        ${signal.expert.domains.map((d, i) => `<span class="px-2 py-1 bg-indigo-50 text-indigo-700 border border-indigo-100 rounded text-xs font-bold w-fit flex items-center"><i class="ph-fill ph-robot mr-1"></i> ${d}</span>`).join('')}
                                    </div>
                                    <div class="col-span-3">
                                        ${renderCrowdBars(signal.crowd.domains)}
                                    </div>
                                </div>

                                <!-- STAGE ROW -->
                                <div class="grid grid-cols-12 gap-4 p-4 border-b border-slate-100 items-center">
                                    <div class="col-span-3 text-slate-500 font-bold text-xs uppercase tracking-wider">Stage</div>
                                    <div class="col-span-3">
                                        <span class="px-2 py-1 bg-slate-100 text-slate-700 rounded text-xs font-semibold">${history.userSelections.stage}</span>
                                    </div>
                                    <div class="col-span-3">
                                        <span class="px-2 py-1 bg-indigo-50 text-indigo-700 border border-indigo-100 rounded text-xs font-bold flex items-center w-fit"><i class="ph-fill ph-robot mr-1"></i> ${signal.expert.stage}</span>
                                    </div>
                                    <div class="col-span-3">
                                        ${renderCrowdBars(signal.crowd.stage)}
                                    </div>
                                </div>

                                <!-- IMPACT ROW -->
                                <div class="grid grid-cols-12 gap-4 p-4 items-center">
                                    <div class="col-span-3 text-slate-500 font-bold text-xs uppercase tracking-wider">Futures Impact</div>
                                    <div class="col-span-3">
                                        <span class="px-2 py-1 bg-slate-100 text-slate-700 rounded text-xs font-semibold">${history.userSelections.impact}</span>
                                    </div>
                                    <div class="col-span-3">
                                        <span class="px-2 py-1 bg-indigo-50 text-indigo-700 border border-indigo-100 rounded text-xs font-bold flex items-center w-fit"><i class="ph-fill ph-robot mr-1"></i> ${signal.expert.impact}</span>
                                    </div>
                                    <div class="col-span-3">
                                        ${renderCrowdBars(signal.crowd.impact)}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- RIGHT PANEL: Scoring & Assumptions -->
                        <div class="space-y-6">
                            <!-- Score Card -->
                            <div class="bg-slate-900 rounded-3xl p-6 text-white shadow-xl relative overflow-hidden">
                                <div class="absolute top-0 right-0 p-4 opacity-10"><i class="ph-fill ph-coins text-8xl"></i></div>
                                
                                <div class="relative z-10 space-y-4">
                                    <h3 class="font-bold text-slate-400 uppercase tracking-widest text-xs">Round Results</h3>
                                    
                                    <div class="flex justify-between items-end border-b border-slate-700 pb-4">
                                        <div>
                                            <div class="text-3xl font-black ${history.alignment >= 60 ? 'text-emerald-400' : 'text-rose-400'}">${history.alignment}%</div>
                                            <div class="text-xs text-slate-400 uppercase tracking-wider mt-1">Oracle Alignment</div>
                                        </div>
                                        <div class="text-right">
                                            <div class="text-sm font-bold text-slate-300">Wager: ${history.wager}</div>
                                        </div>
                                    </div>

                                    <div>
                                        <div class="text-4xl font-black ${history.pointsEarned > 0 ? 'text-amber-400' : 'text-rose-500'}">
                                            ${history.pointsEarned > 0 ? '+' : ''}${history.pointsEarned} Pts
                                        </div>
                                        <div class="text-xs text-slate-400 uppercase tracking-wider mt-1">Strategic Points Added</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Oracle Assumptions -->
                            <div class="bg-indigo-50 border border-indigo-100 rounded-3xl p-6 shadow-md">
                                <h3 class="font-black text-indigo-900 uppercase tracking-widest text-xs flex items-center mb-4">
                                    <i class="ph-fill ph-robot mr-2 text-lg text-indigo-500"></i> Oracle Assumptions
                                </h3>
                                <p class="text-sm text-indigo-800 font-medium leading-relaxed mb-4 bg-white p-3 rounded-xl border border-indigo-100">
                                    ${signal.expert.assumptions}
                                </p>
                                <div class="space-y-2 text-sm text-slate-700">
                                    <p><strong>Reasoning:</strong> ${signal.expert.reasoning}</p>
                                    <p><strong>Ambiguity:</strong> <em>${signal.expert.ambiguity}</em></p>
                                </div>
                            </div>
                        </div>

                    </div>

                    <button onclick="window.nextSignal()" class="w-full py-5 bg-slate-900 hover:bg-amber-500 text-white rounded-2xl font-bold text-xl transition-all shadow-xl shadow-slate-900/20 active:scale-95 flex justify-center items-center">
                        ${isLast ? 'View Final Report' : 'Next Signal'} <i class="ph ph-arrow-right ml-2 text-xl"></i>
                    </button>
                </div>
            `;
        }

        function renderResults() {
            let avgAlign = Math.round(state.history.reduce((sum, h) => sum + h.alignment, 0) / state.history.length);

            appDiv.innerHTML = `
                <div class="w-full space-y-8 fade-in max-w-3xl mx-auto">
                    
                    <div class="text-center space-y-4 pt-4">
                        <div class="inline-block p-4 bg-amber-100 text-amber-600 rounded-full mb-2">
                            <i class="ph-fill ph-trophy text-5xl"></i>
                        </div>
                        <h2 class="text-4xl font-black text-slate-900 tracking-tight">Briefing Complete</h2>
                        <p class="text-lg text-slate-500 font-medium">Your strategic foresight profile for today.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Total Points -->
                        <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 text-center space-y-4 shadow-xl relative overflow-hidden group">
                            <div class="w-16 h-16 mx-auto bg-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center">
                                <i class="ph-fill ph-coins text-3xl"></i>
                            </div>
                            <div class="text-6xl font-black text-white">${state.totalPoints}</div>
                            <div class="text-sm font-bold text-amber-500 uppercase tracking-widest">Total Points</div>
                            <p class="text-sm text-slate-400 leading-relaxed max-w-[250px] mx-auto">Your net score based on wagers and Oracle alignment.</p>
                        </div>
                        
                        <!-- Avg Alignment -->
                        <div class="bg-white p-8 rounded-3xl border border-slate-200 text-center space-y-4 shadow-xl relative overflow-hidden group">
                            <div class="w-16 h-16 mx-auto bg-blue-50 text-blue-500 rounded-2xl flex items-center justify-center">
                                <i class="ph-fill ph-crosshair text-3xl"></i>
                            </div>
                            <div class="text-6xl font-black text-slate-800">${avgAlign}%</div>
                            <div class="text-sm font-bold text-blue-600 uppercase tracking-widest">Avg Alignment</div>
                            <p class="text-sm text-slate-500 leading-relaxed max-w-[250px] mx-auto">How often your analysis matched the AI Oracle's framing.</p>
                        </div>
                    </div>

                    <div class="bg-white border border-slate-200 rounded-3xl p-6 md:p-8 shadow-xl">
                        <h3 class="text-xl font-black text-slate-800 mb-6 flex items-center">
                            <i class="ph ph-clock-counter-clockwise mr-2 text-slate-400"></i> Wager Log
                        </h3>
                        <div class="space-y-3">
                            ${state.history.map((h, i) => `
                                <div class="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-100">
                                    <div class="flex items-center">
                                        <div class="w-8 h-8 rounded-lg bg-slate-200 text-slate-500 flex items-center justify-center text-sm font-bold mr-3">
                                            ${i+1}
                                        </div>
                                        <span class="text-slate-700 font-medium text-sm truncate max-w-[150px] md:max-w-xs">
                                            ${SIGNALS[i].expert.domains[0]} Signal
                                        </span>
                                    </div>
                                    <div class="flex items-center space-x-3">
                                        <span class="text-xs font-bold text-slate-400">Align: ${h.alignment}%</span>
                                        <span class="px-3 py-1 ${h.pointsEarned > 0 ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700'} rounded-lg text-sm font-bold">
                                            ${h.pointsEarned > 0 ? '+' : ''}${h.pointsEarned} Pts
                                        </span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <button onclick="window.startGame()" class="w-full py-5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl font-bold text-xl transition-all flex justify-center items-center active:scale-95 shadow-sm">
                        <i class="ph ph-arrows-clockwise mr-2 text-2xl"></i> Start New Session
                    </button>
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
